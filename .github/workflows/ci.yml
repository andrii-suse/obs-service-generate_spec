name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xz-utils

      - name: Run test suite
        run: |
          make test

      - name: Test installation
        run: |
          make install DESTDIR=/tmp/test_install
          test -x /tmp/test_install/usr/lib/obs/service/generate_spec
          test -f /tmp/test_install/usr/lib/obs/service/generate_spec.service
          test -x /tmp/test_install/usr/lib/obs/service/plugins/go_generator.py
          test -L /tmp/test_install/usr/lib/obs/service/generate_spec.d/30-go.mod

  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python3 -m py_compile generate_spec plugins/go_generator.py tests/test_generate_spec.py

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
